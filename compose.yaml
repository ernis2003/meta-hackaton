name: ja4-forensics

services:
  backend:
    build:
      context: .
      target: backend
    environment:
      DATABASE_PATH: /data/app.sqlite3
      ZEEK_MODE: native
      ZEEK_BIN: /usr/local/zeek/bin/zeek
      ZEEK_SCRIPTS: ja4
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_SURNAME: ${ADMIN_SURNAME:-Account}
      AI_RUNTIME: transformers
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://inference:8002}
      AI_REQUIRE_FINE_TUNED: "true"
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      META_MUSE_MODEL: ${META_MUSE_MODEL:-muse-spark-1.3}
      META_MUSE_BASE_URL: ${META_MUSE_BASE_URL:-https://api.meta.ai/v1}
      META_MUSE_MAX_TOOL_CALLS: ${META_MUSE_MAX_TOOL_CALLS:-4}
    volumes:
      - forensic_data:/data
    extra_hosts:
      - host.docker.internal:host-gateway
    expose:
      - "8001"
    init: true
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  frontend:
    build:
      context: .
      target: frontend
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6

  inference:
    profiles: [gpu]
    build:
      context: .
      target: inference
    environment:
      AI_ADAPTER_PATH: /models/adapter
      HF_HOME: /cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      - type: bind
        source: ${LLAMA_ADAPTER_PATH:-./backend/src/ai/checkpoints/train/adapter}
        target: /models/adapter
        read_only: true
        bind:
          create_host_path: false
      - ${HF_CACHE_PATH:-huggingface_cache}:/cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    expose:
      - "8002"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)); assert d['fine_tuned']"]
      interval: 15s
      timeout: 5s
      start_period: 240s
      retries: 12

volumes:
  forensic_data:
  huggingface_cache:
